<script>
(function() {
    function svgPathLen(d) {
        var tokens = (d || '').match(/[MmLlHhVvCcSsQqTtAaZz]|[-+]?(?:\d+\.?\d*|\.\d+)(?:[eE][-+]?\d+)?/g) || [];
        var total = 0, lifts = 0, px = 0, py = 0, sx = 0, sy = 0, cmd = 'L';
        var COUNTS = {M:2,L:2,H:1,V:1,C:6,S:4,Q:4,T:2,A:7};
        var i = 0, N = tokens.length;
        while (i < N) {
            var t = tokens[i];
            if (/[a-zA-Z]/.test(t)) {
                cmd = t;
                if (t.toUpperCase() === 'Z') { total += Math.hypot(sx - px, sy - py); px = sx; py = sy; }
                i++; continue;
            }
            var c = cmd.toUpperCase(), rel = (cmd !== cmd.toUpperCase() && cmd === cmd.toLowerCase());
            var nc = COUNTS[c] || 0;
            if (!nc || i + nc > N) { i++; continue; }
            var a = [];
            for (var k = 0; k < nc; k++) a.push(parseFloat(tokens[i + k]));
            i += nc;
            var ex, ey;
            if (c === 'M') {
                px = rel ? px + a[0] : a[0]; py = rel ? py + a[1] : a[1];
                sx = px; sy = py; lifts++;
                cmd = rel ? 'l' : 'L';
            } else if (c === 'L') {
                ex = rel ? px + a[0] : a[0]; ey = rel ? py + a[1] : a[1];
                total += Math.hypot(ex - px, ey - py); px = ex; py = ey;
            } else if (c === 'H') {
                ex = rel ? px + a[0] : a[0];
                total += Math.abs(ex - px); px = ex;
            } else if (c === 'V') {
                ey = rel ? py + a[0] : a[0];
                total += Math.abs(ey - py); py = ey;
            } else if (c === 'C' || c === 'S') {
                ex = rel ? px + a[a.length-2] : a[a.length-2];
                ey = rel ? py + a[a.length-1] : a[a.length-1];
                total += Math.hypot(ex - px, ey - py) * 1.15; px = ex; py = ey;
            } else if (c === 'Q' || c === 'T') {
                ex = rel ? px + a[a.length-2] : a[a.length-2];
                ey = rel ? py + a[a.length-1] : a[a.length-1];
                total += Math.hypot(ex - px, ey - py) * 1.1; px = ex; py = ey;
            } else if (c === 'A') {
                ex = rel ? px + a[5] : a[5]; ey = rel ? py + a[6] : a[6];
                var rx = Math.abs(a[0]), chord = Math.hypot(ex - px, ey - py);
                total += rx > 0 ? rx * 2 * Math.asin(Math.min(chord / (2 * rx), 1)) : chord;
                px = ex; py = ey;
            }
        }
        return { len: total, lifts: lifts };
    }

    function estimateSvgEl(svgEl) {
        if (!svgEl) return 0;
        var PX_PER_MM = 100.0 / 25.4;
        var SKIP = ['none','white','#fff','#ffffff','transparent','inherit'];
        var totalMm = 0, totalLifts = 0;
        var colorSet = {};
        var drawSpeedMmpm = (window._pl0tDrawSpeed) || 3000;
        var travelSpeedMmpm = (window._pl0tTravelSpeed) || 6000;
        svgEl.querySelectorAll('path,line,circle,polyline,polygon').forEach(function(el) {
            var style = el.getAttribute('style') || '';
            var sm = style.match(/stroke\s*:\s*([^;]+)/);
            var sc = ((sm && sm[1]) || el.getAttribute('stroke') || '').trim().toLowerCase();
            if (sc && SKIP.indexOf(sc) === -1) colorSet[sc] = 1;
            var tag = el.tagName.toLowerCase();
            if (tag === 'path') {
                var r = svgPathLen(el.getAttribute('d') || '');
                totalMm += r.len / PX_PER_MM; totalLifts += r.lifts;
            } else if (tag === 'line') {
                var x1 = parseFloat(el.getAttribute('x1')||0), y1 = parseFloat(el.getAttribute('y1')||0);
                var x2 = parseFloat(el.getAttribute('x2')||0), y2 = parseFloat(el.getAttribute('y2')||0);
                totalMm += Math.hypot(x2-x1, y2-y1) / PX_PER_MM; totalLifts++;
            } else if (tag === 'circle') {
                totalMm += 2 * Math.PI * parseFloat(el.getAttribute('r')||0) / PX_PER_MM; totalLifts++;
            } else if (tag === 'polyline' || tag === 'polygon') {
                var pts = (el.getAttribute('points')||'').match(/[-+]?\d*\.?\d+/g) || [];
                for (var k = 0; k + 3 < pts.length; k += 2)
                    totalMm += Math.hypot(parseFloat(pts[k+2])-parseFloat(pts[k]),
                                          parseFloat(pts[k+3])-parseFloat(pts[k+1])) / PX_PER_MM;
                totalLifts++;
            }
        });
        if (totalMm <= 0) return { est: 0, high: 0 };
        var drawS    = (totalMm / Math.max(drawSpeedMmpm, 1)) * 60;
        var perLift  = (40 / Math.max(travelSpeedMmpm, 1)) * 60 + 0.5;
        var travelS  = Math.min(totalLifts * perLift, drawS * 0.25);
        var tcS      = Math.max(0, Object.keys(colorSet).length - 1) * 30;
        var estS     = drawS + travelS + tcS;
        var liftDensity = totalLifts / Math.max(totalMm, 1);
        var upperMult = liftDensity < 0.25 ? 5 : liftDensity < 0.5 ? 9 : 18;
        return { est: estS, high: estS * upperMult };
    }

    function fmtDur(s) {
        s = Math.round(s);
        if (s < 60)  return '~' + s + 's';
        var m = Math.floor(s / 60);
        if (m < 60)  return '~' + m + ' min';
        var h = Math.floor(m / 60), rm = m % 60;
        return '~' + h + 'h' + (rm ? ' ' + rm + 'm' : '');
    }
    function _fmtNum(s) {
        s = Math.round(s);
        if (s < 60) return s + 's';
        var m = Math.floor(s / 60);
        if (m < 60) return m + ' min';
        var h = Math.floor(m / 60), rm = m % 60;
        return h + 'h' + (rm ? ' ' + rm + 'm' : '');
    }
    function _fmtRange(low, high) {
        if (high <= low * 1.3) return '~' + _fmtNum(low);
        return '~' + _fmtNum(low) + ' – ' + _fmtNum(high);
    }

    var _estTimer = null;
    var _refined  = false;
    function _resetRefine() {
        _refined = false;
        var rb = document.getElementById('refineEstBtn');
        if (rb) { rb.disabled = false; rb.textContent = 'Refine Estimate'; }
    }
    function scheduleEstimate() {
        clearTimeout(_estTimer);
        _resetRefine();
        _estTimer = setTimeout(function() {
            var btn = document.getElementById('sendToQueue');
            if (!btn) return;
            function setRange(r) {
                if (!r || r.est <= 5) { btn.textContent = '\u2192 Plot'; return; }
                btn.textContent = '\u2192 Plot (' + _fmtRange(r.est, r.high) + ')';
            }
            var liveSvg = document.querySelector('#make-sketch svg');
            if (liveSvg) {
                setRange(estimateSvgEl(liveSvg));
                return;
            }
            if (typeof getSvgString !== 'function') return;
            btn.textContent = '\u2192 Plot (…)';
            getSvgString().then(function(svgStr) {
                try {
                    var doc = new DOMParser().parseFromString(svgStr, 'image/svg+xml');
                    setRange(estimateSvgEl(doc.documentElement));
                } catch(e) { btn.textContent = '\u2192 Plot'; }
            }).catch(function() { btn.textContent = '\u2192 Plot'; });
        }, 2000);
    }

    function patchRegen(api) {
        if (!api || api._estPatched) return;
        api._estPatched = true;
        var orig = api.regenerate;
        api.regenerate = function() {
            var r = orig.apply(this, arguments);
            scheduleEstimate();
            return r;
        };
    }

    window.addEventListener('load', function() {
        patchRegen(window.sketchAPI);
        var _prev = window.sketchAPI;
        setInterval(function() {
            if (window.sketchAPI !== _prev) {
                _prev = window.sketchAPI;
                patchRegen(window.sketchAPI);
            }
        }, 500);
        // Re-estimate whenever the sketch changes
        var sel = document.getElementById('sketchSelector');
        if (sel) sel.addEventListener('change', function() { scheduleEstimate(); });
        scheduleEstimate();

        // Refine Estimate button
        var refBtn = document.getElementById('refineEstBtn');
        if (refBtn) {
            refBtn.addEventListener('click', function() {
                if (_refined) return;
                var rb = this;
                var plotBtn = document.getElementById('sendToQueue');
                rb.disabled = true;
                rb.textContent = 'Running vpype…';
                if (plotBtn) plotBtn.textContent = '\u2192 Plot (…)';
                getSvgString().then(function(svgStr) {
                    return fetch(QUEUE_URL + '/refine_estimate', {
                        method: 'POST',
                        headers: queueHeaders(),
                        body: JSON.stringify({ svg: svgStr })
                    });
                }).then(function(r) {
                    if (!r.ok) throw new Error('server ' + r.status);
                    return r.json();
                }).then(function(d) {
                    _refined = true;
                    if (plotBtn) plotBtn.textContent = '\u2192 Plot (' + fmtDur(d.est_s || 0) + ' ✓)';
                    rb.textContent = 'Refine Estimate';
                    rb.disabled = false;
                }).catch(function(err) {
                    if (plotBtn) plotBtn.textContent = '\u2192 Plot';
                    rb.textContent = 'Refine failed';
                    rb.disabled = false;
                    console.error('refine:', err);
                });
            });
        }
    });
})();
</script>

<script>
// ---- Mode switch + Advanced unlock ----------------------------------------
// Two modes: Advanced (full authoring) and Show (minimal front end).
// ADVANCED -> a solid pill, bottom LEFT, reading "switch to show mode".
// SHOW     -> the same pill goes translucent grey and reads "advanced";
//             clicking it opens a closable keypad to get back in.
// The previous version shrank to a nearly invisible dot in Show mode, which
// left no discoverable way back and forced a trip to the machine tab.
//
// Honest limitation: the passcode is verified by the server so it never ships
// to the page, but the unlocked state is a client flag - this keeps casual
// visitors on the minimal surface, it is not a security boundary. Machine
// control is not exposed here and stays Pi-only either way.
(function () {
    var btn = null, modal = null;

    function styleBtn(adv) {
        var common = 'position:fixed;left:12px;bottom:12px;z-index:9998;cursor:pointer;'
            + 'font:700 10px/1 system-ui,-apple-system,sans-serif;letter-spacing:.09em;'
            + 'padding:8px 12px;border-radius:999px;user-select:none;text-transform:uppercase;'
            + 'transition:opacity .15s,background .15s;';
        if (adv) {
            btn.textContent = 'Switch to show mode';
            btn.title = 'Currently in Advanced mode (full authoring). Click to switch to Show.';
            btn.style.cssText = common + 'background:#7c4dff;color:#fff;opacity:1;'
                + 'box-shadow:0 1px 4px rgba(0,0,0,.25);';
        } else {
            btn.textContent = 'Advanced';
            btn.title = 'Currently in Show mode. Click to unlock Advanced.';
            btn.style.cssText = common + 'background:rgba(120,120,130,.35);color:rgba(255,255,255,.92);'
                + 'opacity:.55;box-shadow:none;';
        }
    }
    function refresh() {
        if (!btn) {
            btn = document.createElement('div');
            btn.id = 'pl0tModeBadge';
            btn.addEventListener('click', onClick);
            document.body.appendChild(btn);
        }
        styleBtn(!!(window.pl0tIsAdvanced && window.pl0tIsAdvanced()));
    }
    window._pl0tRefreshModeBadge = refresh;

    function setMode(m) {
        if (window.makeSketchApp && window.makeSketchApp.setRenderMode) window.makeSketchApp.setRenderMode(m);
        else { window._pl0tMode = m; }
        refresh();
    }

    function closeModal() {
        if (modal) { document.removeEventListener('keydown', onKey); modal.remove(); modal = null; }
    }
    function onKey(e) {
        if (e.key === 'Escape') { closeModal(); return; }
        if (/^[0-9]$/.test(e.key)) push(e.key);
        else if (e.key === 'Backspace') back();
        else if (e.key === 'Enter') submit();
    }
    var entered = '', dots = null, errEl = null;
    function paint() {
        if (!dots) return;
        dots.textContent = entered.replace(/./g, '\u2022') + '\u00b7'.repeat(0);
        dots.style.letterSpacing = '10px';
    }
    function push(d) { if (entered.length < 8) { entered += d; paint(); if (errEl) errEl.textContent = ''; } }
    function back() { entered = entered.slice(0, -1); paint(); }
    function submit() {
        if (!entered) return;
        var code = entered;
        if (!window.QUEUE_URL) { closeModal(); setMode('full'); return; }
        fetch(window.QUEUE_URL + '/studio/unlock', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code: code })
        }).then(function (r) { return r.json(); })
          .then(function (j) {
              if (j && j.ok) { closeModal(); setMode('full'); }
              else { entered = ''; paint(); if (errEl) errEl.textContent = 'Wrong code'; }
          })
          .catch(function () { if (errEl) errEl.textContent = 'Server unreachable'; });
    }

    function openModal() {
        if (modal) return;
        entered = '';
        modal = document.createElement('div');
        modal.style.cssText = 'position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.45);'
            + 'display:flex;align-items:center;justify-content:center;';
        modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(); });

        var card = document.createElement('div');
        card.style.cssText = 'background:#fff;border-radius:14px;padding:18px 18px 14px;width:236px;'
            + 'box-shadow:0 12px 40px rgba(0,0,0,.35);font:400 13px system-ui,-apple-system,sans-serif;position:relative;';

        var x = document.createElement('div');
        x.textContent = '\u00d7';
        x.title = 'Close';
        x.style.cssText = 'position:absolute;top:6px;right:12px;font-size:20px;line-height:1;color:#999;cursor:pointer;';
        x.addEventListener('click', closeModal);
        card.appendChild(x);

        var h = document.createElement('div');
        h.textContent = 'Advanced mode';
        h.style.cssText = 'font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#555;margin-bottom:10px;';
        card.appendChild(h);

        dots = document.createElement('div');
        dots.style.cssText = 'height:26px;border-bottom:2px solid #ddd;margin-bottom:12px;font-size:22px;'
            + 'line-height:26px;color:#333;text-align:center;';
        card.appendChild(dots);

        var grid = document.createElement('div');
        grid.style.cssText = 'display:grid;grid-template-columns:repeat(3,1fr);gap:8px;';
        ['1','2','3','4','5','6','7','8','9','\u232b','0','\u2713'].forEach(function (k) {
            var b = document.createElement('button');
            b.type = 'button';
            b.textContent = k;
            b.style.cssText = 'padding:12px 0;font-size:17px;border:1px solid #e2e2e6;background:#fafafa;'
                + 'border-radius:9px;cursor:pointer;font-family:inherit;';
            b.addEventListener('mousedown', function (e) { e.preventDefault(); });
            b.addEventListener('click', function () {
                if (k === '\u232b') back();
                else if (k === '\u2713') submit();
                else push(k);
            });
            grid.appendChild(b);
        });
        card.appendChild(grid);

        errEl = document.createElement('div');
        errEl.style.cssText = 'min-height:16px;margin-top:8px;color:#c0392b;font-size:11px;text-align:center;';
        card.appendChild(errEl);

        modal.appendChild(card);
        document.body.appendChild(modal);
        document.addEventListener('keydown', onKey);
        paint();
    }

    function onClick() {
        if (window.pl0tIsAdvanced && window.pl0tIsAdvanced()) setMode('fast');
        else openModal();
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', refresh);
    else refresh();
})();
</script>
