<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Make</title>
    <link rel="stylesheet" href="lib/bootstrap.min.css">
    <script src="lib/jquery.min.js"></script>
    <script src="lib/p5.min.js"></script>
    <script src="lib/p5.svg.js"></script>
    <script src="scripts/interactiveSVG.js"></script>
    <script src="scripts/sharedPaperControls.js"></script>
    <script src="scripts/paperSettings.js"></script>
    <script src="scripts/paramLayoutOverrides.js"></script>
    <script src="scripts/autonomous_manifest.js"></script>
    <script src="scripts/autonomousLoader.js"></script>
    <script src="scripts/sharedFills.js"></script>
    <script src="scripts/sketches/cmykFlowCircles.js"></script>
    <script src="scripts/sketches/circlesFromLines.js"></script>
    <script src="scripts/sketches/lineArrays.js"></script>
    <script src="scripts/sketches/zigzag.js"></script>
    <script src="scripts/sketches/whirls.js"></script>
    <script src="scripts/sketches/artproofs.js"></script>
    <script src="scripts/sketches/patternTest.js"></script>
    <script src="scripts/sketches/unbuiltSculptures.js"></script>
    <script src="scripts/sketches/calibration.js"></script>
    <script src="scripts/sketches/svgUpload.js"></script>
    <script src="scripts/sketches/imageTrace.js"></script>
    <script src="scripts/sketches/flipbook.js"></script>
    <script src="scripts/sketches/combo.js"></script>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; background: #fff; overflow: hidden; }
        * { user-select: none; -webkit-user-select: none; }
        input[type=text], input[type=number], textarea { user-select: text; -webkit-user-select: text; }
        #app { display: flex; height: 100vh; overflow: hidden; }

        /* Left: sketch canvas */
        #sketch-col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; padding: 10px 6px 10px 10px; }
        #sketch-frame { flex: 1 1 0; background: #fdfdfd; border: 1px solid #e0e0e0; border-radius: 10px; display: flex; flex-direction: column; overflow: hidden; }
        #sketch-header { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid #eee; flex-shrink: 0; }
        /* Machine busy banner */
        #busy-banner { display: none; color: #ff9800; font-weight: 700; font-size: 13px; padding: 6px; flex-shrink: 0; margin-bottom: 6px; }
        #busy-banner.visible { display: block; }
        #queueStatus { margin: 0 0 6px; }
        .mmon { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600;
                padding:3px 9px; border-radius:11px; background:#f2f4f7; color:#475467; border:1px solid #e4e7ec; }
        .mmon-dot { width:8px; height:8px; border-radius:50%; background:#98a2b3; flex-shrink:0; }
        .mmon.online .mmon-dot { background:#12b76a; }
        .mmon.plotting { background:#3a2000; color:#ff9800; border-color:#5a3000; }
        .mmon.plotting .mmon-dot { background:#ff9800; animation:mmonpulse 1s infinite; }
        .mmon.offline { color:#98a2b3; }
        .mmon.offline .mmon-dot { background:#d0d5dd; }
        @keyframes mmonpulse { 0%,100%{opacity:1} 50%{opacity:.35} }

        #sketch-header label { font-weight: 600; font-size: 14px; margin: 0; white-space: nowrap; }
        #sketchSelector { flex: 1; font-size: 14px; padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; height: 38px; }
        /* align-items:center made the LEFT/TOP overflow unreachable once the
           artboard was bigger than the viewport -- a flexbox centring trap:
           the overflow spills equally both ways but scrollLeft cannot go
           negative, so you could never pan back past the zoom point. Auto
           margins on the child centre it when there is room and collapse to
           0 when there is not, so both edges stay reachable AND a zoomed-out
           artboard sits centred instead of pinned to a corner. */
        #make-sketch { flex: 1 1 0; overflow: auto; display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-start; padding: 8px; }
        #make-sketch > canvas, #make-sketch > svg, #sketch-scroll-wrapper { margin: auto; }
        #make-sketch canvas, #make-sketch svg { width: auto !important; height: auto !important; max-width: 100%; max-height: 100%; border-radius: 8px; display: block; }

        /* Width toggle handle — click to cycle narrow/wide */
        #resize-handle, #global-resize-handle { flex: 0 0 8px; cursor: col-resize; background: transparent; position: relative; }
        #resize-handle::after, #global-resize-handle::after { content: ''; position: absolute; left: 3px; top: 20%; width: 2px; height: 60%; background: #ddd; border-radius: 1px; transition: background .15s; }
        #resize-handle:hover::after, #global-resize-handle:hover::after { background: #888; }

        /* Right: controls panel */
        #ctrl-col { flex: 0 0 320px; min-width: 0; overflow: hidden; display: flex; flex-direction: column; padding: 10px 10px 10px 0; }
        #ctrl-card { flex: 1 1 0; background: #f8f9fb; border: 1px solid #e0e0e0; border-radius: 10px; display: flex; flex-direction: column; overflow: hidden; }
        #ctrl-scroll { flex: 1 1 0; overflow-y: auto; padding: 14px; -webkit-overflow-scrolling: touch; touch-action: pan-y; }

        /* Far left: global authorship panel (Paper, Advanced -- settings that
           are true across every sketch, not specific to the one on screen) */
        #global-col { flex: 0 0 260px; min-width: 0; overflow: hidden; display: flex; flex-direction: column; padding: 10px 0 10px 10px; }
        #global-card { flex: 1 1 0; background: #f8f9fb; border: 1px solid #e0e0e0; border-radius: 10px; display: flex; flex-direction: column; overflow: hidden; }
        #global-scroll { flex: 1 1 0; overflow-y: auto; padding: 14px; -webkit-overflow-scrolling: touch; touch-action: pan-y; }

        /* Touch-friendly controls */
        .control-label { display: flex; align-items: center; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
        .control-label span.value { font-weight: 700; font-variant-numeric: tabular-nums; }
        input[type=range] { width: 100%; height: 28px; cursor: pointer; }
        .mb-ctrl { margin-bottom: 14px; }
        .param-group { border-top: 1px solid #e0e0e0; padding-top: 12px; margin-top: 12px; }
        .param-group:first-child { border-top: 0; padding-top: 0; margin-top: 0; }
        .param-group summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; font-weight: 700; font-size: 13px; color: #111; padding: 4px 0; }
        .param-group summary::-webkit-details-marker { display: none; }
        .param-group summary::after { content: '+'; font-size: 18px; line-height: 1; color: #888; }
        .param-group[open] summary::after { content: '−'; }
        .param-group-body { padding-top: 10px; }
        /* Editable layout: drag param rows between groups / reorder within a group */
        #global-card-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px 0; }
        #global-card-head .head-label { font-size: 11px; font-weight: 700; color: #98a2b3; text-transform: uppercase; letter-spacing: .03em; }
        #editLayoutToggle { border: 1px solid #ccc; background: #fff; border-radius: 8px; padding: 3px 9px; cursor: pointer; font-size: 11px; color: #555; }
        #editLayoutToggle.active { background: #7c4dff; color: #fff; border-color: #7c4dff; }
        .param-group-body [data-param-id] { position: relative; }
        .param-edit-controls { display: none; position: absolute; top: 0; right: 0; align-items: center; gap: 5px; }
        body.pl0t-edit-mode .param-edit-controls { display: flex; }
        .param-edit-controls input[type=checkbox] { cursor: pointer; margin: 0; width: 13px; height: 13px; }
        .param-suppress-btn { border: none; background: none; color: #98a2b3; font-size: 14px; cursor: pointer; padding: 0 2px; line-height: 1; }
        .param-suppress-btn:hover { color: #c00; }
        .param-drag-handle { cursor: grab; color: #98a2b3; font-size: 15px; padding: 0 2px; user-select: none; line-height: 1; }
        body.pl0t-edit-mode .param-group-body [data-param-id] { outline: 1px dashed #e0d4ff; border-radius: 6px; padding: 4px 58px 4px 4px; margin: -4px -4px 8px -4px; }
        [data-param-id].param-suppressed { opacity: 0.45; }
        .param-group-body.drag-over { outline: 2px dashed #7c4dff; outline-offset: 2px; border-radius: 6px; }
        /* Insertion caret: a real element in the flow, so the gap physically
           opens between the two things you're hovering between. */
        .pl0t-drop-caret {
            height: 0; margin: 4px 0; position: relative; pointer-events: none;
            border-top: 2px solid #7c4dff; border-radius: 2px;
            animation: pl0t-caret-in .12s ease-out;
        }
        .pl0t-drop-caret::before {
            content: ''; position: absolute; left: -2px; top: -4px;
            width: 7px; height: 7px; border-radius: 50%; background: #7c4dff;
        }
        @keyframes pl0t-caret-in { from { opacity: 0; margin: 0; } to { opacity: 1; margin: 4px 0; } }

        /* ---- Compact param rhythm ---------------------------------------
           Rows used Bootstrap's .mb-3 (16px) while the Signature panel used
           5px, so Signature read noticeably tighter than every other panel.
           These bring the shared rows down to the same rhythm. Sliders keep
           the stacked label-above-control layout (they need the full width),
           so this matches Signature's DENSITY rather than its one-line form. */
        #ctrl-scroll .param-group-body .mb-3 { margin-bottom: 8px; }
        #ctrl-scroll .control-label { font-size: 12px; margin-bottom: 2px; }
        #ctrl-scroll input[type=range] { height: 22px; }
        #ctrl-scroll .param-group { padding-top: 10px; margin-top: 10px; }
        #ctrl-scroll .param-group-body { padding-top: 8px; }
        #ctrl-scroll .param-group summary { font-size: 12px; padding: 3px 0; }

        /* Signature is the first .param-group of a SEPARATE container, so
           :first-child stripped its top border and it butted straight up
           against the last sketch panel (Textures). Restore the divider. */
        #globalAuthorParams > .param-group:first-child {
            border-top: 1px solid #e0e0e0; padding-top: 10px; margin-top: 10px;
        }

        /* ---- Panel-level authoring controls (Edit layout mode only) ------ */
        .group-edit-controls { display: none; align-items: center; gap: 8px; margin-left: auto; padding-right: 8px; }
        body.pl0t-edit-mode .group-edit-controls { display: inline-flex; }
        .group-edit-controls input[type=checkbox] { cursor: pointer; margin: 0; }
        .group-drag-handle { cursor: grab; color: #9b7ddb; font-size: 13px; line-height: 1; user-select: none; }
        .group-drag-handle:active { cursor: grabbing; }
        body.pl0t-edit-mode .param-group { outline: 1px dashed #ded0ff; outline-offset: 3px; border-radius: 4px; }
        .param-group.drag-ghost { opacity: .45; }
        [data-param-id].drag-ghost { opacity: 0.35; }
        .param-bounds-editor { display: none; gap: 8px; margin-top: 5px; align-items: center; }
        body.pl0t-edit-mode .param-bounds-editor { display: flex; }
        .param-bounds-editor label { display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 9px; color: #98a2b3; }
        .param-bounds-editor input { width: 48px; font-size: 11px; padding: 2px 3px; border: 1px solid #ccc; border-radius: 4px; }
        .palette-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
        .palette-item { display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; user-select: none; }
        .palette-swatch { width: 32px; height: 32px; border-radius: 5px; border: 2px solid #e0e0e0; transition: border-color 0.1s; }
        .palette-item.selected .palette-swatch { border-color: #111; box-shadow: 0 0 0 1px #111; }
        .palette-item.at-max { opacity: 0.35; cursor: not-allowed; }
        .palette-label { font-size: 9px; color: #666; }
        input[type=color] { width: 100%; height: 38px; padding: 2px 3px; cursor: pointer; border-radius: 6px; }

        /* Segmented chip controls (touch-friendly select replacement) */
        .seg-ctrl { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
        .seg-btn { flex: 1 1 auto; min-height: 34px; padding: 5px 8px; border: 1.5px solid #d0d5dd; border-radius: 8px; background: #fff; color: #344054; font-size: 12px; font-weight: 500; cursor: pointer; white-space: nowrap; text-align: center; touch-action: manipulation; -webkit-tap-highlight-color: transparent; line-height: 1.3; user-select: none; }
        .seg-btn:active { background: #e8ecf8; }
        .seg-btn.seg-active { background: #111; color: #fff; border-color: #111; }
        /* Sketch selector chips */
        #sketchSelector { display: none !important; }
        #sketch-header { flex-wrap: wrap; padding-bottom: 10px; }
        #sketch-header label { align-self: center; }
        #sketch-chips { display: flex; flex-wrap: wrap; gap: 5px; flex: 1; }
        .sketch-chip-wrap { display: inline-flex; align-items: center; }
        .sketch-vis-cb { display: none; margin: 0 4px 0 0; width: 13px; height: 13px; cursor: pointer; flex: 0 0 auto; }
        body.pl0t-edit-mode .sketch-vis-cb { display: inline-block; }
        #sketch-chips .seg-btn { flex: 0 0 auto; min-height: 32px; font-size: 12px; padding: 4px 11px; border-radius: 16px; }

        /* Action buttons */
        #ctrl-actions { padding: 10px 14px; border-top: 1px solid #e0e0e0; display: flex; flex-wrap: wrap; gap: 6px; flex-shrink: 0; }
        #ctrl-actions .btn { flex: 1 1 auto; min-width: 70px; font-size: 13px; padding: 8px 10px; min-height: 40px; }
        #saveToQueue { background: #f8f9fb; color: #444; border-color: #ccc; font-weight: 600; }
        #saveToQueue:hover { background: #eee; }
        #saveToQueue:disabled { color: #aaa; }
        #sendToQueue { background: #111; color: #fff; border-color: #111; font-weight: 700; font-size: 14px; }
        #sendToQueue:hover { background: #333; border-color: #333; }
        #sendToQueue:disabled { background: #888; border-color: #888; }
        #renderNow { background: #7c4dff; color: #fff; border-color: #7c4dff; font-weight: 700; }
        #renderNow:hover { background: #6a3df0; border-color: #6a3df0; }
        #renderNow.dirty { box-shadow: 0 0 0 2px #d1b3ff; animation: pl0t-pulse 1.1s ease-in-out infinite; }
        @keyframes pl0t-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.65; } }
        #refineEstBtn { background: transparent; color: #aaa; border: 1px solid #444; font-size: 11px; padding: 2px 8px; border-radius: 4px; cursor: pointer; white-space: nowrap; }
        #refineEstBtn:hover { color: #fff; border-color: #aaa; }
        #refineEstBtn:disabled { color: #555; border-color: #333; cursor: default; }

        /* Status */
        #queueStatus { font-size: 12px; color: #555; padding: 4px 14px 8px; min-height: 20px; flex-shrink: 0; }

        /* Queue strip */
        #queue-strip { padding: 6px 14px 10px; border-top: 1px solid #e0e0e0; flex-shrink: 0; }
        #queue-strip-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; }
        #queue-strip-header span { font-size: 12px; font-weight: 700; color: #555; }
        #mobile-link { display: block; font-size: 10px; color: #aaa; text-decoration: none; margin-top: 1px; }
        #mobile-link:hover { color: #64b5f6; }
        #queueRefreshBtn { background: none; border: none; color: #aaa; cursor: pointer; font-size: 16px; padding: 0 4px; }
        #queueCollapseBtn { background: none; border: none; color: #aaa; cursor: pointer; font-size: 14px; padding: 0 2px; line-height: 1; touch-action: manipulation; }
        #queueCards { display: flex; flex-direction: column; gap: 5px; max-height: 210px; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
        .q-card { display: flex; align-items: center; gap: 6px; background: #fff; border: 1px solid #e0e0e0; border-radius: 7px; padding: 5px 7px; font-size: 11px; }
        .q-card-info { flex: 1; min-width: 0; }
        .q-card-title { font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }
        .q-card-title .q-sketch-name { font-weight: 600; }
        .q-card-meta { color: #aaa; font-size: 10px; margin-top: 1px; }
        .q-card-status { font-size: 10px; margin-top: 1px; }
        .qs-queued { color: #aaa; }
        .qs-plotting { color: #c07000; font-weight: 700; }
        .qs-done { color: #2a7; }
        .qs-error { color: #c00; }
        #queueEmpty { color: #bbb; font-size: 11px; font-style: italic; align-self: center; }
        .q-old-pill { opacity: 0.45; display: flex; align-items: center; justify-content: center; color: #888; font-size: 11px; cursor: default; }
        .q-card-actions { display: flex; gap: 3px; flex-shrink: 0; }
        .q-card-btn { background: none; border: 1px solid #e0e0e0; border-radius: 5px; cursor: pointer; font-size: 13px; padding: 3px 6px; color: #555; touch-action: manipulation; -webkit-tap-highlight-color: transparent; line-height: 1; }
        .q-card-btn:active { background: #f0f0f0; }
        .q-card-btn.q-plot-btn { background: #111; color: #fff; border-color: #111; }
        .q-card-btn.q-plot-btn:active { background: #333; }
            #fetch-progress { display: none; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, #2196f3, #1976d2); animation: progress 1.5s infinite; z-index: 1000; }
        @keyframes progress { 0% { width: 0%; } 50% { width: 70%; } 100% { width: 100%; } }
    </style>
</head>
<body>
<div id="app">
    <div id="fetch-progress"></div>
    <!-- Global authorship column: settings true across every sketch (Paper,
         Advanced) rather than specific to the one on screen. Populated by
         ensureGroup() in makeSketch.js, same as the per-sketch groups on the
         right, but this container is never cleared on a sketch switch. -->
    <div id="global-col">
        <div id="global-card">
            <div id="global-card-head">
                <span class="head-label">Settings</span>
                <button id="editLayoutToggle" type="button" title="Drag controls between groups and reorder them">&#9998; Edit layout</button>
            </div>
            <div id="global-scroll">
                <div id="globalDynamicParams"></div>
            </div>
        </div>
    </div>
    <!-- Sketch column -->
    <div id="global-resize-handle" title="Drag to resize Settings — click to expand/collapse"></div>
    <div id="sketch-col">
        <div id="busy-banner">● Plotting...</div>
        <div id="sketch-frame">
            <div id="sketch-header">
                <label for="sketchSelector">Sketch</label>
                <select id="sketchSelector">
                    <option value="cmyk"               data-script="scripts/sketches/cmykFlowCircles.js" selected>CMYK Flow</option>
                    <option value="circlesFromLines"   data-script="scripts/sketches/circlesFromLines.js">Circles From Lines</option>
                    <option value="lineArrays"         data-script="scripts/sketches/lineArrays.js">Line Arrays</option>
                    <option value="zigzag"             data-script="scripts/sketches/zigzag.js">Zigzag</option>
                    <option value="whirls"             data-script="scripts/sketches/whirls.js">Whirls</option>
                    <option value="artproofs"          data-script="scripts/sketches/artproofs.js">Artproofs</option>
                    <option value="patternTest"        data-script="scripts/sketches/patternTest.js">Pattern Test</option>
                    <option value="unbuiltSculptures"  data-script="scripts/sketches/unbuiltSculptures.js">Unbuilt Sculptures</option>
                    <option value="calibration"        data-script="scripts/sketches/calibration.js">Calibration</option>
                    <option value="svgUpload"          data-script="scripts/sketches/svgUpload.js">SVG Upload</option>
                    <option value="imageTrace"         data-script="scripts/sketches/imageTrace.js">Image Trace</option>
                    <option value="flipbook"           data-script="scripts/sketches/flipbook.js">Flipbook</option>
                    <option value="combo"              data-script="scripts/sketches/combo.js">Combo</option>
                </select>
            </div>
            <div id="make-sketch"></div>
            <div id="zoom-bar" style="display:flex;align-items:center;justify-content:center;gap:3px;padding:4px 0 2px;flex-shrink:0;"><button id="zoom-out" title="Zoom out" style="border:1px solid #ccc;background:#fff;cursor:pointer;font-size:15px;padding:1px 8px;border-radius:4px;line-height:1.3;">&#8722;</button><span id="zoom-pct" style="min-width:42px;text-align:center;font-size:12px;font-family:monospace;color:#555;padding:0 2px;">100%</span><button id="zoom-in"  title="Zoom in"  style="border:1px solid #ccc;background:#fff;cursor:pointer;font-size:15px;padding:1px 8px;border-radius:4px;line-height:1.3;">+</button><button id="zoom-fit" title="Reset to 100%"  style="border:1px solid #ccc;background:#fff;cursor:pointer;font-size:11px;padding:1px 7px;border-radius:4px;line-height:1.5;color:#666;">1:1</button></div>
        </div>
    </div>

    <div id="resize-handle" title="Click to expand/collapse controls"></div>

    <!-- Controls column -->
    <div id="ctrl-col">
        <div id="ctrl-card">
            <div id="ctrl-scroll">
                <div id="dynamicParams"></div>
                <!-- Global authorship settings (survive sketch switches; #dynamicParams is
                     rebuilt per-sketch, this is not). Signature migrated here from the Python OS. -->
                <div id="globalAuthorParams"></div>
            </div>
            <div id="ctrl-actions">
                <button id="reseed"     class="btn btn-outline-secondary" type="button">Reseed</button>
                <button id="randomize"  class="btn btn-outline-secondary" type="button">Random</button>
                <button id="shuffleLayout" class="btn btn-outline-secondary" type="button" style="display:none">Shuffle</button>
                <button id="pause"      class="btn btn-outline-secondary" type="button">Pause</button>
                <button id="renderNow"  class="btn" type="button" style="display:none">⟳ Render</button>
                <button id="saveToQueue" class="btn" type="button">Save</button>
                <button id="sendToQueue" class="btn" type="button">→ Plot</button>
                <button id="refineEstBtn" type="button">Refine Estimate</button>
            </div>
            <div id="queueStatus"></div>
            <div id="queue-strip">
                <div id="queue-strip-header">
                    <div>
                        <span style="font-size:12px;font-weight:700;color:#555;">Queue <span id="queueCount"></span></span>
                        <a href="http://pl0tb0tpi5:5001/mobile" id="mobile-link" target="_blank">&#128241; pl0tb0tpi5:5001/mobile</a>
                    </div>
                    <div style="display:flex;gap:2px;align-items:center;">
                        <button id="queueCollapseBtn" title="Collapse">&#9656;</button>
                        <button id="queueRefreshBtn" title="Refresh">&#8635;</button>
                    </div>
                </div>
                <div id="queueCards" style="display:none"><span id="queueEmpty">No jobs queued.</span></div>
            </div>
        </div>
    </div>
</div>

<script>
    window.IS_LOCAL_MODE = true;
    var QUEUE_URL = window.QUEUE_URL || 'http://localhost:5001';
    var QUEUE_API_KEY = window.QUEUE_API_KEY || 'pl0tb0t-secret';
    function queueHeaders() { return { 'Content-Type': 'application/json', 'X-API-Key': QUEUE_API_KEY }; }
    window.QUEUE_URL = QUEUE_URL; window.QUEUE_API_KEY = QUEUE_API_KEY;

    // placeholder API until sketch loads
    window.sketchAPI = { regenerate: function(){}, togglePause: function(){ return false; } };

    window.controls = { shapeCount: 90, orbitSize: 180, speed: 0.012, hueShift: 200, trail: 16 };

    // ── Button wiring ─────────────────────────────────────────────────────────

    // ── Queue helpers ─────────────────────────────────────────────────────────
    function queueStatus(msg, color) {
        var el = document.getElementById('queueStatus');
        el.style.color = color || '#555';
        el.textContent = msg;
    }

    // ---- Capture ANY sketch's real geometry -------------------------------
    // Combo needs actual elements from the other sketches, not lookalikes. Every
    // sketch already serialises its exact plottable geometry through saveSVG(),
    // so the cheapest honest way to reuse one is to run the real thing in a
    // hidden p5 instance and read its SVG back. No duplicated generator code,
    // and an element can never drift from the sketch it came from.
    //
    // Paths are flattened with the browser's own getPointAtLength(), so arcs and
    // beziers (artproofs emits arcs) come through correctly rather than needing
    // a hand-written path parser.
    // Captures MUST run one at a time. This function monkeypatches three
    // globals for the duration of a capture (document.getElementById,
    // URL.createObjectURL, HTMLAnchorElement.prototype.click). Two overlapping
    // captures each save the OTHER's patched version as "the original" and
    // restore it on cleanup, so the redirects leak or vanish mid-flight and
    // both hang until their timeouts. Adding several elements at once did
    // exactly that -- nothing rendered for minutes. A serial queue makes the
    // patching safe without touching the capture logic itself.
    var _capQueue = Promise.resolve();
    window.pl0tCaptureSketchGeometry = function (sketchName, opts) {
        var run = function () { return _pl0tCaptureOne(sketchName, opts); };
        var next = _capQueue.then(run, run);
        // keep the chain alive even when one capture fails
        _capQueue = next.then(function () {}, function () {});
        return next;
    };
    function _pl0tCaptureOne(sketchName, opts) {
        opts = opts || {};
        return new Promise(function (resolve, reject) {
            var fn = window.sketches && window.sketches[sketchName];
            if (typeof fn !== 'function') return reject(new Error('unknown sketch: ' + sketchName));
            if (sketchName === 'combo') return reject(new Error('cannot nest combo inside itself'));

            var hidden = document.createElement('div');
            hidden.style.cssText = 'position:fixed;left:-99999px;top:0;width:800px;height:1000px;';
            document.body.appendChild(hidden);

            var realGet = document.getElementById.bind(document);
            document.getElementById = function (id) { return id === 'make-sketch' ? hidden : realGet(id); };

            var capturedApi = null, inst = null, finished = false;
            var sigCfg = window._signatureConfig;
            var sigWasEnabled = !!(sigCfg && sigCfg.enabled);
            if (sigCfg) sigCfg.enabled = false;
            var origCOU = URL.createObjectURL;
            var origClick = HTMLAnchorElement.prototype.click;
            var blobText = null;
            var presetLabels = [];
            var paramDefs = [];

            function cleanup() {
                document.getElementById = realGet;
                URL.createObjectURL = origCOU;
                HTMLAnchorElement.prototype.click = origClick;
                if (sigCfg) sigCfg.enabled = sigWasEnabled;
                try { if (inst && inst.remove) inst.remove(); } catch (e) {}
                try { hidden.remove(); } catch (e) {}
            }
            var timer = setTimeout(function () {
                if (!finished) { finished = true; cleanup(); reject(new Error('capture timed out: ' + sketchName)); }
            }, 15000);

            try {
                inst = new window.p5(function (pp) {
                    var origRegister = null;
                    Object.defineProperty(pp, 'registerSketchAPI', {
                        configurable: true,
                        set: function (v) { origRegister = v; try { v(function (a) { capturedApi = a; }); } catch (e) {} },
                        get: function () { return origRegister; }
                    });
                    fn(pp);
                }, hidden);
            } catch (e) {
                clearTimeout(timer); finished = true; cleanup(); return reject(e);
            }

            // Let p5 run setup/draw, then push overrides and grab the SVG.
            setTimeout(function () {
                if (finished) return;
                presetLabels = (capturedApi && Array.isArray(capturedApi.stylePresets))
                    ? capturedApi.stylePresets.map(function (x, i) { return (x && x.label) ? x.label : ('Preset ' + (i + 1)); })
                    : [];
                // Serialisable copies only -- these cross into the host sketch and get
                // rebuilt as its own controls. Actions are dropped (they'd fire the
                // source's buttons), and so is anything the HOST owns for the whole
                // page: paper, margin, palette and pen width are Combo's job.
                var OWNED = { paperSize:1, margin:1, customWidth:1, customHeight:1, palette:1, penWidthMm:1, viewMode:1 };
                paramDefs = (capturedApi && Array.isArray(capturedApi.params))
                    ? capturedApi.params.filter(function (d) {
                          return d && d.id && d.type !== 'action' && !OWNED[d.id];
                      }).map(function (d) {
                          return { id: d.id, label: d.label, type: d.type, min: d.min, max: d.max,
                                   step: d.step, value: d.value, tip: d.tip,
                                   options: d.options ? d.options.map(function (o) {
                                       return (o && typeof o === 'object') ? { value: o.value, label: o.label } : o;
                                   }) : undefined,
                                   multiSelect: d.multiSelect,
                                   visibleWhen: d.visibleWhen };
                      })
                    : [];
                if (!capturedApi || typeof capturedApi.saveSVG !== 'function') {
                    finished = true; clearTimeout(timer); cleanup();
                    return reject(new Error('no saveSVG on ' + sketchName));
                }
                try {
                    // Apply a preset first (real presets from the source sketch),
                    // then any explicit param overrides on top.
                    if (opts.presetIndex != null && Array.isArray(capturedApi.stylePresets)) {
                        var ps = capturedApi.stylePresets[opts.presetIndex % capturedApi.stylePresets.length];
                        if (ps && ps.values) {
                            Object.keys(ps.values).forEach(function (k) {
                                try { capturedApi.setParam(k, ps.values[k]); } catch (e) {}
                            });
                        }
                    }
                    if (opts.params) {
                        Object.keys(opts.params).forEach(function (k) {
                            try { capturedApi.setParam(k, opts.params[k]); } catch (e) {}
                        });
                    }
                    if (opts.reseed && typeof capturedApi.reseed === 'function') capturedApi.reseed();
                    if (typeof capturedApi.regenerate === 'function') capturedApi.regenerate();
                } catch (e) {}

                setTimeout(function () {
                    if (finished) return;
                    URL.createObjectURL = function (blob) {
                        var u = origCOU(blob);
                        try { blob.text().then(function (t) { blobText = t; }); } catch (e) {}
                        return u;
                    };
                    HTMLAnchorElement.prototype.click = function () {
                        if (this.download) return;      // swallow the download
                        return origClick.call(this);
                    };
                    try { capturedApi.saveSVG(); } catch (e) {}
                    setTimeout(function () {
                        if (finished) return;
                        finished = true; clearTimeout(timer);
                        var txt = blobText;
                        cleanup();
                        if (!txt || txt.length < 50) return reject(new Error('empty SVG from ' + sketchName));
                        try {
                            resolve({ polys: window.pl0tSvgToPolylines(txt), presets: presetLabels, paramDefs: paramDefs });
                        } catch (e) { reject(e); }
                    }, 350);
                }, opts.settleMs || 500);
            }, opts.setupMs || 450);
        });
    };

    // SVG -> [{color, pts:[{x,y}...]}], flattened via the browser so every path
    // command (arcs, beziers) is handled without a bespoke parser.
    window.pl0tSvgToPolylines = function (svgText) {
        var doc = new DOMParser().parseFromString(svgText, 'image/svg+xml');
        var svg = doc.documentElement;
        var host = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        host.setAttribute('width', '10'); host.setAttribute('height', '10');
        host.style.cssText = 'position:fixed;left:-99999px;top:0;';
        document.body.appendChild(host);
        var out = [];
        function strokeOf(el) {
            var s = el.getAttribute('stroke');
            if (s && s !== 'none') return s;
            var par = el.parentNode, guard = 0;
            while (par && par.getAttribute && guard++ < 6) {
                var ps = par.getAttribute('stroke');
                if (ps && ps !== 'none') return ps;
                par = par.parentNode;
            }
            return '#000000';
        }
        function flattenPath(d, color) {
            var pe = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            pe.setAttribute('d', d);
            host.appendChild(pe);
            var total = 0;
            try { total = pe.getTotalLength(); } catch (e) { total = 0; }
            if (total > 0.5) {
                // Subpaths ('M' restarts) must not be joined by a stroke, so split
                // the d string and flatten each piece independently.
                var subs = d.match(/[Mm][^Mm]*/g) || [d];
                subs.forEach(function (sub) {
                    var sp = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    sp.setAttribute('d', sub);
                    host.appendChild(sp);
                    var L = 0;
                    try { L = sp.getTotalLength(); } catch (e) { L = 0; }
                    if (L > 0.4) {
                        var steps = Math.max(2, Math.min(400, Math.ceil(L / 2)));
                        var pts = [];
                        for (var i = 0; i <= steps; i++) {
                            var pt = sp.getPointAtLength(L * i / steps);
                            pts.push({ x: pt.x, y: pt.y });
                        }
                        out.push({ color: color, pts: pts });
                    }
                    sp.remove();
                });
            }
            pe.remove();
        }
        Array.prototype.forEach.call(svg.querySelectorAll('path'), function (el) {
            var d = el.getAttribute('d'); if (d) flattenPath(d, strokeOf(el));
        });
        Array.prototype.forEach.call(svg.querySelectorAll('line'), function (el) {
            out.push({ color: strokeOf(el), pts: [
                { x: +el.getAttribute('x1'), y: +el.getAttribute('y1') },
                { x: +el.getAttribute('x2'), y: +el.getAttribute('y2') }] });
        });
        Array.prototype.forEach.call(svg.querySelectorAll('polyline,polygon'), function (el) {
            var raw = (el.getAttribute('points') || '').trim().split(/[\s,]+/).map(Number);
            var pts = [];
            for (var i = 0; i + 1 < raw.length; i += 2) pts.push({ x: raw[i], y: raw[i + 1] });
            if (el.nodeName.toLowerCase() === 'polygon' && pts.length) pts.push(pts[0]);
            if (pts.length > 1) out.push({ color: strokeOf(el), pts: pts });
        });
        // Rects: the page border/background is a rect too, so skip anything
        // unfilled-and-unstroked or clearly page-sized.
        // Page furniture, not artwork: every sketch draws a full-page border
        // rect, which was being captured as part of the element (it showed up as
        // a stray #b4b4b4 outline around each one).
        var vb = (svg.getAttribute('viewBox') || '').split(/[\s,]+/).map(Number);
        var pageW = vb.length === 4 ? vb[2] : (parseFloat(svg.getAttribute('width')) || 0);
        var pageH = vb.length === 4 ? vb[3] : (parseFloat(svg.getAttribute('height')) || 0);
        Array.prototype.forEach.call(svg.querySelectorAll('rect'), function (el) {
            var st = el.getAttribute('stroke');
            if (!st || st === 'none') return;
            var x = +el.getAttribute('x') || 0, y = +el.getAttribute('y') || 0;
            var w = +el.getAttribute('width') || 0, h = +el.getAttribute('height') || 0;
            if (w <= 0 || h <= 0) return;
            if (pageW > 0 && pageH > 0 && w >= pageW * 0.94 && h >= pageH * 0.94) return;   // page border
            out.push({ color: st, pts: [{x:x,y:y},{x:x+w,y:y},{x:x+w,y:y+h},{x:x,y:y+h},{x:x,y:y}] });
        });
        host.remove();
        return out;
    };

    function captureSvgFromSaveSVG() {
        return new Promise(function(resolve, reject) {
            if (!window.sketchAPI || typeof window.sketchAPI.saveSVG !== 'function')
                return reject(new Error('saveSVG not available'));
            var origCOU = URL.createObjectURL;
            var origClick = HTMLAnchorElement.prototype.click;
            var capturedText = null;
            var done = false;
            var timer = setTimeout(function() {
                if (!done) { cleanup(); reject(new Error('SVG capture timed out')); }
            }, 8000);
            function cleanup() {
                URL.createObjectURL = origCOU;
                HTMLAnchorElement.prototype.click = origClick;
            }
            URL.createObjectURL = function(blob) {
                URL.createObjectURL = origCOU;
                var realUrl = origCOU(blob);
                blob.text().then(function(t){ capturedText = t; });
                return realUrl;
            };
            HTMLAnchorElement.prototype.click = function() {
                if (this.download) {
                    HTMLAnchorElement.prototype.click = origClick;
                    done = true; clearTimeout(timer);
                    setTimeout(function() {
                        cleanup();
                        if (capturedText && capturedText.length > 50) resolve(capturedText);
                        else reject(new Error('SVG blob was empty'));
                    }, 200);
                    return;
                }
                return origClick.call(this);
            };
            try { window.sketchAPI.saveSVG(); }
            catch(e) { cleanup(); done = true; clearTimeout(timer); reject(e); }
        });
    }

    // Plot horizontal: rotate the finished portrait SVG 90° (content + signature)
    // into a landscape page, so it fits a machine whose Y axis is shorter than X.
    function rotateSvgForPlot(svgStr) {
        try {
            var doc = new DOMParser().parseFromString(svgStr, 'image/svg+xml');
            var svg = doc.documentElement;
            if (!svg || svg.nodeName.toLowerCase() !== 'svg') return svgStr;
            var W = parseFloat(svg.getAttribute('width'));
            var H = parseFloat(svg.getAttribute('height'));
            if (!(W > 0 && H > 0)) {
                var vb = (svg.getAttribute('viewBox') || '').split(/[\s,]+/).map(Number);
                if (vb.length === 4) { W = vb[2]; H = vb[3]; }
            }
            if (!(W > 0 && H > 0)) return svgStr;
            var g = doc.createElementNS('http://www.w3.org/2000/svg', 'g');
            g.setAttribute('transform', 'translate(' + H + ',0) rotate(90)');
            while (svg.firstChild) g.appendChild(svg.firstChild);
            svg.appendChild(g);
            svg.setAttribute('width', H);
            svg.setAttribute('height', W);
            svg.setAttribute('viewBox', '0 0 ' + H + ' ' + W);
            return new XMLSerializer().serializeToString(svg);
        } catch (e) { return svgStr; }
    }

    function getSvgString() {
        // "Signature only": skip capturing the sketch's own art entirely (avoids
        // invoking any per-sketch saveSVG/render side effects) and build a minimal
        // border + signature page directly, at the current global paper size.
        if (window._signatureConfig && window._signatureConfig.onlySignature &&
            window.makeSketchUtils && window.makeSketchApp && typeof window.makeSketchApp.getSignatureSvgForQueue === 'function') {
            try {
                var _dims = window.makeSketchUtils.getPaperPixels();
                var _sig = window.makeSketchApp.getSignatureSvgForQueue(null) || '';
                var _svg = '<?xml version="1.0" encoding="UTF-8"?>\n' +
                    '<svg xmlns="http://www.w3.org/2000/svg" width="' + _dims.width + '" height="' + _dims.height +
                    '" viewBox="0 0 ' + _dims.width + ' ' + _dims.height + '">\n' +
                    '<rect x="1" y="1" width="' + (_dims.width - 2) + '" height="' + (_dims.height - 2) + '" fill="none" stroke="#b4b4b4" stroke-width="2"/>\n' +
                    _sig + '\n</svg>';
                if (window._pl0tPlotHorizontal) _svg = rotateSvgForPlot(_svg);
                return Promise.resolve(_svg);
            } catch (e) { /* fall through to the normal capture path */ }
        }
        var svgEl = document.querySelector('#make-sketch svg');
        var p = svgEl ? Promise.resolve(new XMLSerializer().serializeToString(svgEl))
                      : captureSvgFromSaveSVG();
        return p.then(function(svgStr) {
            try {
                // skip if signature already embedded by the sketch's own saveSVG
                if (!svgStr.includes('id="signature"') &&
                    window.makeSketchApp && typeof window.makeSketchApp.getSignatureSvgForQueue === 'function') {
                    var sigSvg = window.makeSketchApp.getSignatureSvgForQueue(svgEl);
                    if (sigSvg) svgStr = svgStr.replace(/<\/svg>\s*$/, sigSvg + '</svg>');
                }
            } catch(e) { /* signature injection failed — proceed without it */ }
            if (window._pl0tPlotHorizontal) svgStr = rotateSvgForPlot(svgStr);
            return svgStr;
        });
    }

    function embedSnapshot(svgStr, sketchId, params) {
        try {
            var payload = btoa(unescape(encodeURIComponent(JSON.stringify({sketch: sketchId, params: params}))));
            return svgStr.replace(/<\/svg>/, '\n<!-- pl0tb0t-snapshot ' + payload + ' -->\n</svg>');
        } catch(e) { return svgStr; }
    }

    function addToQueue(options) {
        document.getElementById("fetch-progress").style.display = "block";
        var btn = options.btn;
        btn.disabled = true;
        // SVG generation is in p5.js, not shown
        var sketchId  = document.getElementById('sketchSelector').value || 'sketch';
        var paperSize = (document.getElementById('paperSize') || {}).value || '9x12';
        var snapshot  = window.sketchAPI && window.sketchAPI.getParamsSnapshot ? window.sketchAPI.getParamsSnapshot() : [];
        var recipe    = window.sketchAPI && typeof window.sketchAPI.getRecipe === 'function'
            ? window.sketchAPI.getRecipe() : { sketch: sketchId, params: snapshot };
        getSvgString().then(function(svgStr) {
            svgStr = embedSnapshot(svgStr, sketchId, recipe && Array.isArray(recipe.params) ? recipe.params : snapshot);
            queueStatus('Sending to queue…', '#888');
            return fetch(QUEUE_URL + '/jobs', {
                method: 'POST',
                headers: queueHeaders(),
                body: JSON.stringify({ svg: svgStr, recipe: recipe, sketch_name: sketchId, paper_size: paperSize, orientation: (window._pl0tLandscape ? 'landscape' : 'portrait') })
            });
        }).then(function(r) {
            if (!r.ok) return r.json().catch(function(){ return {}; }).then(function(d){ throw new Error((d && d.error) ? d.error : 'Server ' + r.status); });
            return r.json();
        }).then(function(data) {
            var jobId = data.job_id || data.id;
            if (!options.requestPlot) {
                queueStatus('✓ Saved! Job #' + jobId, '#2a7');
                setTimeout(function(){ queueStatus(''); }, 4000);
                fetchQueue();
                return;
            }
            queueStatus('Requesting plot…', '#888');
            return fetch(QUEUE_URL + '/jobs/' + jobId + '/plot-request', {
                method: 'POST',
                headers: queueHeaders()
            }).then(function() {
                queueStatus('✓ Plot requested! Confirm in window.', '#2a7');
                setTimeout(function(){ queueStatus(''); }, 6000);
                fetchQueue();
            });
        }).catch(function(err) {
            queueStatus('Error: ' + err.message, '#c00');
        }).finally(function() { btn.disabled = false; document.getElementById("fetch-progress").style.display = "none"; });
    }

    document.getElementById('saveToQueue').addEventListener('click', function() {
        addToQueue({ requestPlot: false, btn: this });
    });

    document.getElementById('sendToQueue').addEventListener('click', function() {
        var btn = this;
        // Up-front connection gate: don't march the user through pen
        // confirmation + gcode generation only to dead-end because the machine
        // isn't connected. Only block when we KNOW it's disconnected (=== false);
        // if the state was never pushed (undefined) we fail open.
        if (window._pl0tMachineConnected === false) {
            queueStatus('Machine not connected — click Connect on the Machine tab first.', '#c00');
            setTimeout(function(){ queueStatus(''); }, 6000);
            return;
        }
        var palette;
        if (window.sketchAPI && window.sketchAPI.getPlotColors) {
            palette = window.sketchAPI.getPlotColors();
        } else {
            var snapshot = window.sketchAPI && window.sketchAPI.getParamsSnapshot ? window.sketchAPI.getParamsSnapshot() : [];
            var paletteParam = snapshot.find ? snapshot.find(function(p){ return p.id === 'palette'; }) : null;
            palette = (paletteParam && Array.isArray(paletteParam.value) && paletteParam.value.length) ? paletteParam.value : ['#000000'];
        }
        var paperSize = (document.getElementById('paperSize') || {}).value || '9x12';
        // Append signature as a labeled slot if it will be injected into the SVG
        if (window._signatureConfig && window._signatureConfig.enabled) {
            var _sigColor = (window.Signature && window.Signature.pickSignatureColor) ? window.Signature.pickSignatureColor(palette) : '#000000';
            var _artHasSig = palette.some(function(e) {
                return (typeof e === 'string' ? e : e.color).toLowerCase() === _sigColor.toLowerCase();
            });
            if (!_artHasSig) {
                palette = palette.slice();
                palette.push({ color: _sigColor, label: 'Signature Layer' });
            }
        }
        showPenConfirmDialog(palette, paperSize, function() {
            btn.disabled = true;
            var banner = document.getElementById('busy-banner');
            banner.textContent = '● Plotting… generating SVG';
            banner.classList.add('visible');
            fetch(QUEUE_URL + '/status').then(function(r){ return r.json(); }).then(function(s) {
                if (s.busy) {
                    addToQueue({ requestPlot: false, btn: btn });
                } else {
                    addToQueue({ requestPlot: true, btn: btn });
                }
            }).catch(function() {
                addToQueue({ requestPlot: false, btn: btn });
            });
        });
    });

    // ── Queue strip ───────────────────────────────────────────────────────────
    function loadRecipeIntoEditor(recipe) {
        if (!recipe || typeof recipe !== 'object') return;
        var sketchId = recipe.sketch || '';
        var sel = document.getElementById('sketchSelector');
        function apply() {
            if (window.sketchAPI && typeof window.sketchAPI.applyRecipe === 'function') {
                window.sketchAPI.applyRecipe(recipe);
            } else if (window.sketchAPI && typeof window.sketchAPI.applyParamsSnapshot === 'function' && Array.isArray(recipe.params)) {
                window.sketchAPI.applyParamsSnapshot(recipe.params);
            }
        }
        if (sel && sketchId && sel.value !== sketchId) {
            sel.value = sketchId;
            var chips = document.getElementById('sketch-chips');
            if (chips) chips.querySelectorAll('.seg-btn').forEach(function(b) {
                b.classList.toggle('seg-active', b.dataset.val === sketchId);
            });
            sel.dispatchEvent(new Event('change'));
            setTimeout(apply, 700);
        } else {
            apply();
        }
    }

    function fetchQueue() {
        fetch(QUEUE_URL + '/jobs', { headers: queueHeaders() }).then(function(r){ return r.json(); }).then(function(jobs) {
            var cards = document.getElementById('queueCards');
            var empty = document.getElementById('queueEmpty');
            var count = document.getElementById('queueCount');
            if (!jobs || !jobs.length) {
                cards.innerHTML = '';
                cards.appendChild(empty);
                count.textContent = '';
                return;
            }
            var now = Date.now() / 1000;
            var recent = jobs.filter(function(j){ return now - (j.created_at || 0) < 86400; });
            var old    = jobs.filter(function(j){ return now - (j.created_at || 0) >= 86400; });
            var show   = recent.length ? recent : jobs;
            count.textContent = '(' + jobs.length + ')';
            cards.innerHTML = '';
            show.slice(0, 12).forEach(function(j) {
                var card = document.createElement('div');

                (function(jj) {

                        e.stopPropagation();
                        fetch(QUEUE_URL + '/jobs/' + jj.id + '/plot-request', { method: 'POST', headers: queueHeaders() })

    document.getElementById('queueRefreshBtn').addEventListener('click', fetchQueue);

    setInterval(fetchQueue, 10000);
    fetchQueue();

    // ── Machine status monitor ────────────────────────────────────────────────
    // Always-on indicator of the target machine (whatever QUEUE_URL points at --
    // localhost, or the Pi when driving from another computer). Reuses /status
    // and the /capabilities handshake for the machine name.
    var _mmonName = '';
    function renderMachineMonitor(cls, label) {

                       '<span class="mmon-state">' + label + '</span></div>';

    function fetchMachineStatus() {
        fetch(QUEUE_URL + '/status').then(function(r){ return r.json(); }).then(function(s) {
            var banner = document.getElementById('busy-banner');

    fetchMachineCapabilities();
    setInterval(fetchMachineCapabilities, 30000);

    fetchMachineStatus();

    // ── Skip Layers (session-only; resets on app restart) ─────────────────────
    window._pl0tSkippedLayers = window._pl0tSkippedLayers || [];

    function _pl0tCurrentPalette() {
        var palette;
        if (window.sketchAPI && window.sketchAPI.getPlotColors) {
            palette = window.sketchAPI.getPlotColors();
        } else {
            var snapshot = window.sketchAPI && window.sketchAPI.getParamsSnapshot ? window.sketchAPI.getParamsSnapshot() : [];
            var paletteParam = snapshot.find ? snapshot.find(function(p){ return p.id === 'palette'; }) : null;
            palette = (paletteParam && Array.isArray(paletteParam.value) && paletteParam.value.length) ? paletteParam.value : ['#000000'];
        }
        if (window._signatureConfig && window._signatureConfig.enabled) {
            var _sigColor = (window.Signature && window.Signature.pickSignatureColor) ? window.Signature.pickSignatureColor(palette) : '#000000';
            var _artHasSig = palette.some(function(e) {
                return (typeof e === 'string' ? e : e.color).toLowerCase() === _sigColor.toLowerCase();
            });
            if (!_artHasSig) {
                palette = palette.slice();
                palette.push({ color: _sigColor, label: 'Signature Layer' });
            }
        }
        return palette;
    }

    // Restrict the plot to exactly one colour (everything else skipped).
    // Clicking the solo dot of the already-soloed colour clears the filter.
    window._pl0tSoloLayer = function (color) {
        var cl = String(color || '').toLowerCase();
        var pal = _pl0tCurrentPalette().map(function (e) {
            return (typeof e === 'string' ? e : e.color).toLowerCase();
        });
        var others = pal.filter(function (c) { return c !== cl; });
        var alreadySolo = window._pl0tSkippedLayers.length === others.length
            && others.every(function (c) { return window._pl0tSkippedLayers.indexOf(c) !== -1; });
        window._pl0tSkippedLayers = alreadySolo ? [] : others;
        _pl0tRenderSkipPanel();
        if (typeof window._pl0tOnSkipLayersChanged === 'function') window._pl0tOnSkipLayersChanged();
    };
    window._pl0tPlotAllLayers = function () {
        window._pl0tSkippedLayers = [];
        _pl0tRenderSkipPanel();
        if (typeof window._pl0tOnSkipLayersChanged === 'function') window._pl0tOnSkipLayersChanged();
    };

    function _pl0tRenderSkipPanel() {
        var grid = document.getElementById('skipLayersGrid');
        if (!grid) return;
        var palette = _pl0tCurrentPalette();
        var _sk = window._pl0tSkippedLayers || [];
        var _status = document.getElementById('skipLayersStatus');
        if (_status) {
            var _on = palette.length - _sk.length;
            _status.textContent = _sk.length
                ? ('Plotting ' + _on + ' of ' + palette.length + ' layers')
                : 'Plotting all layers';
            _status.style.color = _sk.length ? '#b45309' : '#777';
        }
        grid.innerHTML = palette.map(function(entry) {
            var c   = typeof entry === 'string' ? entry : entry.color;
            var lbl = (typeof entry === 'object' && entry.label) ? entry.label : c;
            var cl  = c.toLowerCase();
            var skipped = window._pl0tSkippedLayers.indexOf(cl) !== -1;
            return '<div class="palette-item skip-item" data-color="' + cl + '" title="' + lbl + (skipped ? ' (skipped)' : '') + '">'
                + '<div class="palette-swatch" style="background:' + c + ';position:relative;' + (skipped ? 'opacity:0.35;' : '') + '">'
                + (skipped ? '<span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#c00;font-weight:900;font-size:18px;text-shadow:0 0 2px #fff;">&times;</span>' : '')
                + '</div><span class="palette-label">' + lbl + '</span>'
                + '<button type="button" class="skip-solo" data-color="' + cl + '" title="Plot ONLY this layer (click again to clear)"'
                + ' style="margin-top:2px;font-size:9px;padding:1px 5px;border:1px solid #ccc;background:#fff;border-radius:8px;cursor:pointer;">solo</button>'
                + '</div>';
        }).join('');
        Array.prototype.forEach.call(grid.querySelectorAll('.skip-solo'), function(b) {
            b.addEventListener('click', function(e) {
                e.stopPropagation();      // don't also toggle the swatch underneath
                window._pl0tSoloLayer(b.getAttribute('data-color'));
            });
        });
        Array.prototype.forEach.call(grid.querySelectorAll('.skip-item'), function(el) {
            el.addEventListener('click', function() {
                var c = el.getAttribute('data-color');
                var idx = window._pl0tSkippedLayers.indexOf(c);
                if (idx === -1) window._pl0tSkippedLayers.push(c);
                else window._pl0tSkippedLayers.splice(idx, 1);
                _pl0tRenderSkipPanel();
                if (typeof window._pl0tOnSkipLayersChanged === 'function') window._pl0tOnSkipLayersChanged();
            });
        });
    }

    // Rendered into the sketch's own "Advanced" params group by makeSketch.js
    // (buildSkipLayersUI), which calls window._pl0tRenderSkipPanel() on every
    // param-UI rebuild so the swatches stay in sync with the active sketch.
    window._pl0tRenderSkipPanel = _pl0tRenderSkipPanel;

    function showPenConfirmDialog(palette, paperSize, onConfirm, onCancel) {

        var overlay = document.createElement('div');
        overlay.id = 'pen-confirm-overlay';
        overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.45);z-index:9999;display:flex;align-items:center;justify-content:center;';
        var dlg = document.createElement('div');
        dlg.style.cssText = 'background:#fff;border-radius:8px;padding:20px 24px;min-width:280px;box-shadow:0 4px 24px rgba(0,0,0,0.25);font-family:inherit;';
        // Look up each colour's loaded pen type + the exact draw-Z it will use,
        // so this dialog is the single safety gate (pen type + tip-length Z).
        var _penList = (window.plotPens && window.plotPens.pens) ? window.plotPens.pens() : [];
        var _zoff = window._pl0tPenZOffsets || {};
        var _contactZ = (typeof window._pl0tPenContactZ === 'number') ? window._pl0tPenContactZ : 0;
        function _penTypeForColor(col) {
            col = (col || '').toLowerCase();
            for (var k = 0; k < _penList.length; k++) { if ((_penList[k].color || '').toLowerCase() === col) return _penList[k].pen_type || ''; }
            return '';
        }
        var rows = palette.map(function(entry, i) {
            var c   = typeof entry === 'string' ? entry : entry.color;
            var lbl = (typeof entry === 'object' && entry.label) ? entry.label : c;
            var isSkipped = (window._pl0tSkippedLayers || []).indexOf(c.toLowerCase()) !== -1;
            var pt = _penTypeForColor(c);
            var info;
            if (isSkipped) {
                info = '<b style="color:#c00;">skipped</b><br>will not plot';
            } else if (pt) {
                var z = (Number(_zoff[pt]) || 0) + _contactZ;
                info = '<b>' + pt + '</b><br>Z ' + (z >= 0 ? '+' : '') + z.toFixed(2) + ' mm';
            } else {
                info = '<span style="color:#c0392b;">pen type not set</span>';
            }
            return '<div style="display:flex;flex-direction:column;align-items:center;gap:4px;min-width:76px;' + (isSkipped ? 'opacity:0.45;' : '') + '">'
                + '<div style="width:28px;height:28px;border-radius:4px;border:1px solid #ccc;background:' + c + ';flex-shrink:0;"></div>'
                + '<div style="font-size:12px;text-align:center;line-height:1.4;">' + lbl + '<br>Slot ' + (i+1) + '<br>' + info + '</div>'
                + '</div>';
        }).join('');
        dlg.innerHTML = '<div style="font-weight:700;font-size:14px;margin-bottom:8px;">Confirm Pen Assignments</div>'
            + '<div style="font-size:12px;color:#555;margin-bottom:12px;">SVG colors will be plotted in this order, left to right &mdash; matching the holder slots on the machine.<br>Make sure each slot has the correct pen loaded.</div>'
            + '<div style="font-size:12px;color:#555;margin-bottom:12px;">Paper: ' + paperSize + '</div>'
            + '<div style="display:flex;flex-direction:row-reverse;flex-wrap:wrap;gap:14px;justify-content:flex-start;margin-bottom:4px;">' + rows + '</div>'
            + '<div style="display:flex;gap:8px;margin-top:16px;justify-content:flex-end;">'
            + '<button id="jspca-cancel" style="padding:7px 16px;border:1px solid #ccc;border-radius:5px;background:#f5f5f5;cursor:pointer;font-size:13px;">Cancel</button>'
            + '<button id="jspca-plot" style="padding:7px 16px;border:none;border-radius:5px;background:#4caf50;color:#fff;cursor:pointer;font-size:13px;font-weight:600;">Plot</button>'
            + '</div>';
        overlay.appendChild(dlg);
        document.body.appendChild(overlay);
        document.getElementById('jspca-cancel').onclick = function() { overlay.remove(); if(onCancel) onCancel(); };
        document.getElementById("jspca-plot").onclick  = function() { overlay.remove(); onConfirm(); };
        overlay.addEventListener("keydown", function(e) { if (e.key === "Enter") { overlay.remove(); onConfirm(); } if (e.key === "Escape") { overlay.remove(); if(onCancel) onCancel(); } });
        overlay.setAttribute("tabindex", "-1"); overlay.focus();
    }


    function setBannerText(text) {
        if (!text) { var b = document.getElementById("busy-banner"); b.classList.remove("visible"); b.dataset.pyStep = ""; return; }
        var b = document.getElementById('busy-banner');
        b.textContent = text;
        b.dataset.pyStep = text;
        b.classList.add('visible');
    }

    // Rich live plot progress: color swatch of the drawing layer + % complete,
    // keeping the "continue making art" note. Called ~4Hz from Python during a plot.
    function setPlotProgress(info) {
        var b = document.getElementById('busy-banner');
        if (!b) return;
        var pct = (info && typeof info.pct === 'number') ? info.pct : 0;
        // Uniform typography across all three banner lines.
        var _ln = 'font-size:12px;font-weight:600;line-height:1.65;';
        var layerLine = '';
        if (info && info.color) {
            var swatch = '<span style="display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid #ccc;background:'
                + info.color + ';vertical-align:middle;margin-right:6px;"></span>';
            var lbl = info.label ? (' \u2014 ' + info.label) : '';
            var ofN = info.layers ? ' &nbsp;(' + info.layer + ' of ' + info.layers + ')' : '';
            layerLine = '<div style="' + _ln + '">Current layer: ' + swatch
                + '<b>' + info.color + '</b>' + lbl + ofN + '</div>';
        }
        b.innerHTML = '<div style="' + _ln + '">\u25cf Plot in progress \u2014 ' + pct.toFixed(0) + '% complete</div>'
            + layerLine
            + '<div style="' + _ln + 'opacity:0.75;">You may continue making art.</div>';
        b.dataset.pyStep = 'plotting';
        b.classList.add('visible');
    }

<script>
(function() {
    // Left-hand (Settings) column resizer. Same interaction as the right one:
    // drag to size, click without dragging to toggle wide/narrow. Note the sign
    // flip on dx -- this handle sits to the RIGHT of the column it resizes, so
    // dragging right grows it, whereas the other handle is to the LEFT of its
    // column and dragging right shrinks it.
    (function () {
        var gHandle = document.getElementById('global-resize-handle');
        var gCol    = document.getElementById('global-col');
        if (!gHandle || !gCol) return;
        var gx = 0, gw = 190, gDrag = false;
        function setGW(w) {
            gCol.style.flex = '0 0 ' + w + 'px';
            gCol.style.minWidth = '0';
        }
        gHandle.addEventListener('pointerdown', function (e) {
            gHandle.setPointerCapture(e.pointerId);
            gx = e.clientX;
            gw = gCol.offsetWidth || 190;
            gDrag = false;
            e.preventDefault();
        });
        gHandle.addEventListener('pointermove', function (e) {
            if (!gHandle.hasPointerCapture(e.pointerId)) return;
            var dx = e.clientX - gx;
            if (Math.abs(dx) > 4) gDrag = true;
            if (gDrag) setGW(Math.max(150, Math.min(720, gw + dx)));
        });
        gHandle.addEventListener('pointerup', function (e) {
            gHandle.releasePointerCapture(e.pointerId);
            if (!gDrag) {
                var cur = gCol.offsetWidth || 190;
                setGW(cur < 400 ? 560 : 190);
            }
            gDrag = false;
        });
    })();

    var handle  = document.getElementById('resize-handle');
    var ctrlCol = document.getElementById('ctrl-col');
    var dragStartX = 0, dragStartW = 320, didDrag = false;

    function setW(w) {
        ctrlCol.style.flex = '0 0 ' + w + 'px';
        ctrlCol.style.minWidth = '0';
    }

    handle.addEventListener('pointerdown', function(e) {
        handle.setPointerCapture(e.pointerId);
        dragStartX = e.clientX;
        dragStartW = ctrlCol.offsetWidth || 320;
        didDrag = false;
        e.preventDefault();
    });
    handle.addEventListener('pointermove', function(e) {
        if (!handle.hasPointerCapture(e.pointerId)) return;
        var dx = e.clientX - dragStartX;
        if (Math.abs(dx) > 4) didDrag = true;
        if (didDrag) setW(Math.max(240, Math.min(720, dragStartW - dx)));
    });
    handle.addEventListener('pointerup', function(e) {
        handle.releasePointerCapture(e.pointerId);
        if (!didDrag) {
            var cur = ctrlCol.offsetWidth || 320;
            setW(cur < 500 ? 720 : 320);
        }
        didDrag = false;
    });
})();

// Sketch selector: replace native <select> with touch-friendly chip row
(function() {
    var origSel = document.getElementById('sketchSelector');
    if (!origSel) return;
    var chips = document.createElement('div');
    chips.id = 'sketch-chips';
    Array.from(origSel.options).forEach(function(opt) {
        // Wrapper so the visibility checkbox can sit beside the chip -- an <input>
        // nested inside a <button> is invalid and its clicks fight the button's.
        var wrap = document.createElement('span');
        wrap.className = 'sketch-chip-wrap';
        wrap.dataset.val = opt.value;

        var cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.className = 'sketch-vis-cb';
        cb.title = 'Show this sketch in Show mode';
        cb.checked = !(window.ParamLayout && window.ParamLayout.getSketchHidden(opt.value));
        cb.addEventListener('click', function(e) { e.stopPropagation(); });
        cb.addEventListener('change', function(e) {
            e.stopPropagation();
            if (window.ParamLayout) window.ParamLayout.setSketchHidden(opt.value, !cb.checked);
            applySketchChipVis();
        });
        wrap.appendChild(cb);

        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'seg-btn' + (opt.value === origSel.value ? ' seg-active' : '');
        btn.textContent = opt.textContent.trim();
        btn.dataset.val = opt.value;
        btn.addEventListener('click', function() {
            if (origSel.value === opt.value) return;
            origSel.value = opt.value;
            chips.querySelectorAll('.seg-btn').forEach(function(b) {
                b.classList.toggle('seg-active', b.dataset.val === origSel.value);
            });
            origSel.dispatchEvent(new Event('change'));
            applySketchChipVis();   // the active chip is always kept visible
        });
        wrap.appendChild(btn);
        chips.appendChild(wrap);
    });

    // In Show mode, unticked sketches drop out of the row. The ACTIVE sketch is
    // always kept -- a selector with nothing selected reads as broken, and the
    // canvas is drawing it regardless.
    function applySketchChipVis() {
        var adv = !!(window.pl0tIsAdvanced && window.pl0tIsAdvanced());
        Array.prototype.forEach.call(chips.querySelectorAll('.sketch-chip-wrap'), function(w) {
            var v = w.dataset.val;
            var hidden = !!(window.ParamLayout && window.ParamLayout.getSketchHidden(v));
            var isActive = (origSel.value === v);
            w.style.display = (!adv && hidden && !isActive) ? 'none' : '';
        });
    }
    window._pl0tRefreshSketchChips = applySketchChipVis;

    document.getElementById('sketch-header').appendChild(chips);
    applySketchChipVis();
})();
</script>

<script>
(function() {
    var wrap   = document.getElementById('make-sketch');
    var pctLbl = document.getElementById('zoom-pct');
    if (!wrap) return;
    var zoom = 1.0;
    var STEPS = [0.25, 0.33, 0.5, 0.67, 0.75, 1.0, 1.25, 1.5, 2.0, 3.0, 4.0];

    function getCanvas() { return wrap.querySelector('canvas') || wrap.querySelector('svg'); }

    // Intrinsic px size of the zoom target (canvas dims, or svg viewBox/width-height).
    function targetDims(c) {
        if (c && c.tagName && c.tagName.toLowerCase() === 'svg') {
            var vb = (c.getAttribute('viewBox') || '').split(/[\s,]+/).map(Number);
            if (vb.length === 4 && vb[2] && vb[3]) return { w: vb[2], h: vb[3] };
            return { w: parseFloat(c.getAttribute('width')) || 648, h: parseFloat(c.getAttribute('height')) || 864 };
        }
        return { w: (c && c.width) || 648, h: (c && c.height) || 864 };
    }

    // ensure canvas is inside a sizing wrapper so overflow scroll works
    function getWrapper() {
        var w = document.getElementById('sketch-scroll-wrapper');
        if (!w) {
            var c = getCanvas();
            if (!c) return null;
            w = document.createElement('div');
            w.id = 'sketch-scroll-wrapper';
            w.style.flexShrink = '0';
            w.style.overflow = 'visible';
            c.parentNode.insertBefore(w, c);
            w.appendChild(c);
        }
        return w;
    }

    function applyZoom(z) {
        zoom = Math.max(0.1, Math.min(8, z));
        if (pctLbl) pctLbl.textContent = Math.round(zoom * 100) + '%';
        var c = getCanvas();
        if (!c) return;
        var w = getWrapper();
        var rot = !!window._pl0tPlotHorizontal;
        // Reset any prior transform styling before re-applying.
        c.style.transform = '';
        c.style.transformOrigin = '';
        c.style.position = '';
        c.style.top = '';
        c.style.left = '';
        c.style.maxWidth = '';
        c.style.maxHeight = '';
        c.style.pointerEvents = '';
        if (w) { w.style.position = ''; w.style.width = ''; w.style.height = ''; }
        wrap.style.cursor = '';
        if (zoom === 1.0 && !rot) return;   // default: CSS fits it

        var _d = targetDims(c);
        var cw = _d.w, ch = _d.h;
        c.style.pointerEvents = 'none';     // let drags hit wrap
        if (rot) {
            // Portrait artboard shown rotated 90\u00b0 (matches Plot horizontal export).
            var availW = Math.max(40, wrap.clientWidth - 8);
            var availH = Math.max(40, wrap.clientHeight - 8);
            var fit = Math.min(availW / ch, availH / cw);   // rotated footprint = ch wide x cw tall
            if (!isFinite(fit) || fit <= 0) fit = 1;
            var s = fit * zoom;
            if (w) {
                w.style.position = 'relative';
                w.style.width  = (ch * s) + 'px';
                w.style.height = (cw * s) + 'px';
            }
            c.style.position = 'absolute';
            c.style.top = '50%';
            c.style.left = '50%';
            c.style.maxWidth = 'none';
            c.style.maxHeight = 'none';
            c.style.transformOrigin = 'center center';
            c.style.transform = 'translate(-50%, -50%) rotate(90deg) scale(' + s + ')';
            if (zoom !== 1.0) wrap.style.cursor = 'grab';
        } else {
            // The wrapper used to be sized from the INTRINSIC canvas dims while the
            // canvas itself still rendered at its CSS max-width:100% fitted size.
            // The two disagreed, so the wrapper was a larger box than the artwork
            // drawn inside it and centring it left the artboard visibly off-centre.
            // Compute the fit explicitly (same as the rotated branch) so 100% means
            // the same thing in both, and wrapper size == rendered size exactly.
            var availW2 = Math.max(40, wrap.clientWidth - 16);
            var availH2 = Math.max(40, wrap.clientHeight - 16);
            var fit2 = Math.min(availW2 / cw, availH2 / ch);
            if (!isFinite(fit2) || fit2 <= 0) fit2 = 1;
            var s2 = fit2 * zoom;
            c.style.maxWidth = 'none';
            c.style.maxHeight = 'none';
            c.style.transformOrigin = 'top left';
            c.style.transform = 'scale(' + s2 + ')';
            if (w) {
                w.style.width  = (cw * s2) + 'px';
                w.style.height = (ch * s2) + 'px';
            }
            wrap.style.cursor = 'grab';
        }
    }

    // Let the Plot-horizontal toggle re-apply the rotated display.
    window._pl0tApplyOrientation = function () { try { applyZoom(zoom); } catch (e) {} };

    function stepZoom(dir) {
        var best = 0, bd = Infinity;
        for (var i = 0; i < STEPS.length; i++) {
            var d = Math.abs(STEPS[i] - zoom);
            if (d < bd) { bd = d; best = i; }
        }
        applyZoom(STEPS[Math.max(0, Math.min(STEPS.length - 1, best + dir))]);
    }

    var zi = document.getElementById('zoom-in');
    var zo = document.getElementById('zoom-out');
    var zf = document.getElementById('zoom-fit');
    if (zi) zi.addEventListener('click', function(e) { e.stopPropagation(); stepZoom(1);  });
    if (zo) zo.addEventListener('click', function(e) { e.stopPropagation(); stepZoom(-1); });
    if (zf) zf.addEventListener('click', function(e) { e.stopPropagation(); applyZoom(1); });

    // scroll-wheel zoom
    wrap.addEventListener('wheel', function(e) {
        e.preventDefault();
        stepZoom(e.deltaY < 0 ? 1 : -1);
    }, { passive: false });

    // pan: left-click drag on wrap when zoomed (canvas has pointer-events:none so clicks land here)
    // also support middle-click as fallback
    var panOn = false, px, py, sx, sy;
    function startPan(e) {
        panOn = true; px = e.clientX; py = e.clientY;
        sx = wrap.scrollLeft; sy = wrap.scrollTop;
        wrap.style.cursor = 'grabbing';
        e.preventDefault();
    }
    wrap.addEventListener('mousedown', function(e) {
        if (zoom === 1.0) return;          // no pan at native scale
        if (e.button === 0 || e.button === 1) startPan(e);
    });
    window.addEventListener('mousemove', function(e) {
        if (!panOn) return;
        wrap.scrollLeft = sx - (e.clientX - px);
        wrap.scrollTop  = sy - (e.clientY - py);
    });
    window.addEventListener('mouseup', function(e) {
        if (!panOn) return;
        panOn = false;
        wrap.style.cursor = zoom !== 1.0 ? 'grab' : '';
    });

    // re-apply zoom after sketch reloads (canvas element replaced)
    new MutationObserver(function() {
        if (zoom !== 1.0 || window._pl0tPlotHorizontal) setTimeout(function() { applyZoom(zoom); }, 60);
    }).observe(wrap, { childList: true, subtree: true });
})();
</script>
